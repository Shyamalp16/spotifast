name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: fix-spotify-shared-redirect
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install GUI build dependency
        shell: pwsh
        run: vcpkg install glew:x64-windows-static

      - name: Build Spotifast
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build setup installer
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DVersion=$version" "/DArch=x86_64" "/DBinary=$PWD\target\x86_64-pc-windows-msvc\release\spotifast.exe" "/DOutputDir=$PWD\dist" packaging\windows\spotifast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          gem install native-packages --version 0.10.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $payload = "dist\msi-input-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\spotifast.exe", "README.md", "LICENSE", "packaging\windows\spotifast-installer.txt" $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target windows-amd64 --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\windows-amd64\msi\*.msi" dist\

      - uses: actions/upload-artifact@v4
        with:
          name: spotifast-pr-windows-x64
          path: dist/*
          if-no-files-found: error
